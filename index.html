<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Microbiología</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bacteria:#c81d5e;--hongo:#b45f06;--virus:#5b45d6;--parasito:#167a40;--azul:#0066cc;
--bg:#f4f7fb;--card:#ffffff;--ink:#14202b;--ink2:#33424f;--mute:#5a6b7b;--mute2:#5f6e7c;--line:#dde4ec;--chip:#eef2f7;--chip2:#e2e8f0;--panel:#ffffff;
--f:"Inter",-apple-system,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
button{font-family:inherit}
nav{position:fixed;top:0;left:0;right:0;height:calc(48px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.84);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
nav .in{max-width:980px;height:100%;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:6px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:var(--mute);font-size:13px;font-weight:500;padding:6px 12px;cursor:pointer;white-space:nowrap;border-radius:20px;transition:color .2s}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--ink);background:rgba(20,40,70,.08)}
.hero{min-height:100vh;padding:110px 20px 40px;text-align:center;position:relative;overflow:hidden}
.kicker{font-size:21px;font-weight:600;color:var(--c);margin:0 0 6px}
h1{font-size:clamp(40px,8vw,88px);line-height:1.02;font-weight:700;letter-spacing:-.035em;margin:0 auto;max-width:14ch}
h1.sp{font-style:italic;max-width:18ch}
.lema{font-size:clamp(20px,3vw,30px);font-weight:500;margin:14px 0 0;color:var(--ink)}
.links{margin-top:18px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.links a{color:var(--azul);font-size:19px;text-decoration:none;cursor:pointer}
.links a:hover{text-decoration:underline}
.arte{position:relative;display:grid;place-items:center;height:min(88vw,520px);margin-top:20px;color:var(--c)}
.arte .portada{width:min(70vw,380px);aspect-ratio:1;border-radius:50%;object-fit:cover;position:relative;z-index:2;box-shadow:0 0 44px var(--c);animation:flota 7s ease-in-out infinite}
.arte svg{width:min(78vw,400px);position:relative;z-index:2;filter:drop-shadow(0 0 28px var(--c));animation:flota 7s ease-in-out infinite}
.aro{position:absolute;border-radius:50%;aspect-ratio:1;background:conic-gradient(from 0deg,transparent 0,var(--c) 30%,transparent 65%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));filter:drop-shadow(0 0 16px var(--c));animation:giro 16s linear infinite}
.aro.a{width:min(92vw,520px)}
.aro.b{width:min(72vw,420px);animation-duration:24s;animation-direction:reverse;opacity:.7}
.multi .aro{background:conic-gradient(#e0407a,#f0a030,#2fbf6a,#8a7bf0,#e0407a);filter:none;opacity:.85}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes flota{50%{transform:translateY(-14px) rotate(2deg)}}
.seccion{max-width:980px;margin:0 auto;padding:70px 20px 0}
.seccion h2{font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-.025em;margin:0 0 28px}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.dato{background:var(--card);border-radius:22px;padding:24px}
.dato b{display:block;font-size:13px;font-weight:600;color:var(--c);margin-bottom:6px}
.dato span{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--card);border-radius:22px;padding:28px}
.card h3{font-size:22px;font-weight:700;margin:0 0 10px;color:var(--c);letter-spacing:-.01em}
.card p{margin:0;color:var(--ink2)}
.card ul{margin:0;padding-left:20px;color:var(--ink2)}
.card li{margin-bottom:5px}
.pend{color:var(--mute2);font-style:italic}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.galeria figure{margin:0;background:var(--card);border-radius:22px;overflow:hidden}
.galeria img{width:100%;display:block}
.galeria figcaption{padding:12px 18px;font-size:14px;color:var(--mute)}
.vacio{border:2px dashed var(--line);border-radius:22px;padding:34px 24px;text-align:center;color:var(--mute2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:980px;margin:50px auto 0;padding:0 20px}
.tile{background:var(--card);border:0;border-radius:26px;padding:26px 20px 24px;text-align:center;color:var(--ink);cursor:pointer;transition:background .25s}
.tile:hover{background:var(--chip)}
.tile svg{width:130px;color:var(--c);filter:drop-shadow(0 0 14px var(--c))}
.tile .g{display:block;font-size:14px;font-weight:600;color:var(--c);margin-top:8px}
.tile .n{display:block;font-size:20px;font-weight:700;font-style:italic;line-height:1.2;margin:2px 0 8px}
.tile .m{color:var(--azul);font-size:16px}
.gente{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.gente span{background:var(--card);border-radius:30px;padding:8px 18px;font-size:15px;color:var(--ink2)}
ol{padding-left:22px;margin:0;color:var(--ink2)}li{margin-bottom:6px}
footer{text-align:center;color:var(--mute2);font-size:13px;padding:70px 20px 40px}
.rv{opacity:0;transform:translateY(46px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
.progreso{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));left:0;height:3px;width:0;z-index:51;background:linear-gradient(90deg,#ff4f8b,#ffb347,#4fe08a,#9b8cff)}
.hero>*{position:relative;z-index:1}
.hero>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.arte{will-change:transform,opacity}
.arte svg,.arte .portada{translate:calc(var(--mx,0)*20px) calc(var(--my,0)*20px)}
.aro{translate:calc(var(--mx,0)*-12px) calc(var(--my,0)*-12px)}
.credito{font-size:12px;color:var(--mute2);margin:8px auto 0;max-width:560px}
.card.on{transition:opacity .9s ease,transform .3s ease,box-shadow .3s ease}
.card.on:hover{transform:translateY(-6px);box-shadow:0 0 0 1px var(--c),0 20px 50px -22px var(--c)}
.tile:hover{transform:translateY(-4px)}
.ent{animation:entra .6s ease}
@keyframes entra{from{opacity:0}to{opacity:1}}
/* ===== Asistente ===== */
.ask{display:none;margin-top:16px;align-items:center;gap:6px;background:transparent;color:var(--c);border:1px solid var(--c);border-radius:30px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.ia .ask{display:inline-flex}
.ask:hover{background:var(--c);color:#fff}
.velo{position:fixed;inset:0;background:rgba(20,32,43,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:55}
.velo.on{opacity:1;pointer-events:auto}
.chat{position:fixed;z-index:60;top:0;right:0;bottom:0;width:min(450px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.7,.2,1);visibility:hidden}
.chat.abierto{transform:none;visibility:visible}
.cab{display:flex;gap:12px;align-items:flex-start;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.cab div{flex:1;min-width:0}
.cab small{display:block;font-size:13px;font-weight:600;color:var(--c)}
.cab strong{display:block;font-size:18px;line-height:1.25}
.cab button{background:var(--chip);border:0;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.burbuja{max-width:92%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.burbuja p{margin:0 0 8px}.burbuja p:last-child{margin:0}
.burbuja ul{margin:4px 0 8px;padding-left:20px}
.burbuja.yo{align-self:flex-end;background:var(--c);color:#fff;border-bottom-right-radius:6px}
.burbuja.ia{align-self:flex-start;background:var(--chip);color:var(--ink);border-bottom-left-radius:6px}
.burbuja.pensando{color:var(--mute);font-style:italic}
.hola{color:var(--mute);font-size:15px;margin:0}
.sugs{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 10px}
.sugs button{background:var(--chip);color:var(--ink);border:0;border-radius:30px;padding:8px 14px;font-size:14px;cursor:pointer}
.sugs button:hover{background:var(--chip2)}
.entrada{display:flex;gap:10px;align-items:flex-end;padding:10px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.entrada textarea{flex:1;resize:none;max-height:120px;background:var(--chip);color:var(--ink);border:0;border-radius:20px;padding:11px 16px;font:16px/1.4 var(--f)}
.entrada textarea::placeholder{color:var(--mute2)}
.entrada button{background:var(--c);color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:20px;font-weight:700;cursor:pointer;flex:none}
.entrada button:disabled{opacity:.4;cursor:default}
@media (max-width:640px){
  .chat{top:auto;left:0;width:100%;height:84vh;height:84dvh;border-left:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(105%)}
  .chat.abierto{transform:none}
}
/* ===== Acordeón (pestañitas que se abren y cierran) ===== */
.acc{display:block}
.acc-item{background:var(--card);border-radius:22px;border-top:3px solid var(--c);margin-bottom:14px;position:sticky;top:calc(62px + env(safe-area-inset-top,0px) + var(--n,0)*12px);z-index:calc(var(--n,0) + 2);scroll-margin-top:calc(74px + env(safe-area-inset-top,0px) + var(--n,0)*12px);box-shadow:0 -10px 24px rgba(20,40,70,.14)}
.acc-item.on{transition:opacity .9s ease,transform .4s ease,filter .4s ease,box-shadow .3s ease}
.acc-item.tapada{transform:scale(.965);filter:brightness(.93)}
.acc-item.open{position:relative;top:auto;z-index:0;box-shadow:0 0 0 1px var(--c)}
.acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;color:var(--ink);font:700 20px/1.3 var(--f);letter-spacing:-.01em;text-align:left;padding:22px 26px;cursor:pointer;border-radius:22px}
.acc-item.open .acc-head{color:var(--c)}
.mas{position:relative;width:18px;height:18px;flex:none}
.mas::before,.mas::after{content:"";position:absolute;background:var(--c);border-radius:2px;transition:transform .35s ease}
.mas::before{left:0;right:0;top:8px;height:2px}
.mas::after{top:0;bottom:0;left:8px;width:2px}
.acc-item.open .mas::after{transform:scaleY(0)}
.acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.acc-panel>div{overflow:hidden;visibility:hidden;transition:visibility .4s}
.acc-item.open .acc-panel{grid-template-rows:1fr}
.acc-item.open .acc-panel>div{visibility:visible}
.acc-in{padding:0 26px 26px;color:var(--ink2)}
.acc-in p{margin:0}.acc-in ul{margin:0;padding-left:20px}.acc-in li{margin-bottom:5px}
@media (max-width:640px){.acc-head{padding:18px 20px;font-size:18px}.acc-in{padding:0 20px 22px}}
@media (prefers-reduced-motion:reduce){.acc-panel,.acc-panel>div,.mas::before,.mas::after{transition:none}}
.acc-in p+p{margin-top:12px}
.acc-in h4{font-size:17px;font-weight:700;color:var(--ink);margin:24px 0 8px}
.acc-in li b{color:var(--ink)}
.figs{display:grid;gap:16px;margin-top:22px}
.figs figure{margin:0;max-width:880px;margin-inline:auto;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.figs img{display:block;width:100%;height:auto;cursor:zoom-in}
.pista{font-size:13px;color:var(--mute2);margin:10px 0 0;text-align:center}
.luz{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.luz.on{display:block}
.luz img{display:block;margin:auto;max-width:100%;max-height:100vh;max-height:100dvh;width:auto;height:auto;cursor:zoom-in}
.luz.grande img{max-width:none;max-height:none;width:230%;cursor:zoom-out}
.luz button{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:2;background:var(--chip);color:var(--ink);border:0;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}
.aviso{max-width:640px;margin:10px auto 0;background:var(--card);border-radius:26px;border-top:3px solid var(--c);padding:30px 28px 34px;text-align:center}
.aviso .tag{display:inline-flex;align-items:center;gap:10px;font:600 13px var(--f);color:var(--c);letter-spacing:.06em;text-transform:uppercase}
.aviso h2{font-size:clamp(22px,4vw,30px);margin:12px 0 10px;padding:0;border:0}
.aviso p{margin:0;color:var(--ink2)}
.punto{width:9px;height:9px;border-radius:50%;background:var(--c);animation:pulso 1.8s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 var(--c)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.barra{height:6px;border-radius:6px;background:var(--chip);margin:24px auto 0;max-width:320px;overflow:hidden}
.barra i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(90deg,transparent,var(--c),transparent);animation:desliza 1.8s ease-in-out infinite}
@keyframes desliza{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.punto,.barra i{animation:none}}
/* ===== Tema claro ===== */
body{background:linear-gradient(180deg,#eef3f9 0%,#ffffff 42%,#eef3f9 100%)}
nav{border-bottom:1px solid var(--line)}
.hero{background:radial-gradient(ellipse 85% 60% at 50% 0%,rgba(0,102,204,.10),transparent 72%)}
.card,.dato,.tile,.aviso,.figs figure{border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,40,70,.05),0 10px 28px -14px rgba(20,40,70,.18)}
.acc-item{border-left:1px solid var(--line);border-right:1px solid var(--line)}
.arte svg{filter:drop-shadow(0 12px 26px rgba(20,40,70,.28))}
.tile svg{filter:drop-shadow(0 6px 12px rgba(20,40,70,.22))}
.arte .portada{box-shadow:0 18px 46px -12px rgba(20,40,70,.4),0 0 0 6px #fff}
.chat{box-shadow:-20px 0 60px -20px rgba(20,40,70,.3)}
.acc-in a,.cab a{color:var(--azul);word-break:break-word}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;margin-top:6px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.figs .antes{margin:10px 0 0;font-size:17px}
.figs figcaption{padding:10px 16px 12px;font-size:13px;line-height:1.5;color:var(--mute);border-top:1px solid var(--line);background:#fff;word-break:break-word}
.figs figcaption a{color:var(--azul)}
/* ===== Celular y computador ===== */
nav .in{justify-content:flex-start;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
nav .in button:first-child{margin-left:auto}
nav .in button:last-child{margin-right:auto}
nav button{min-height:36px}
@supports (height:100svh){.hero{min-height:100svh}}
@media (hover:none){.card.on:hover,.tile:hover{transform:none;box-shadow:none}}
@media (max-height:520px) and (orientation:landscape){.hero{min-height:auto;padding-top:80px}}
@media (max-width:640px){
  body{font-size:16px}
  .hero{padding:84px 16px 28px}
  .kicker{font-size:17px}
  .links{gap:22px}.links a{font-size:17px}
  .arte{height:min(92vw,400px);margin-top:12px}
  .aro.a{width:min(94vw,400px)}.aro.b{width:min(74vw,320px)}
  .arte svg{width:min(70vw,300px)}
  .arte .portada{width:min(62vw,280px)}
  .seccion{padding:48px 16px 0}
  .card{padding:22px}
  .dato{padding:20px}.dato span{font-size:19px}
  .tiles{grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px;margin-top:36px}
  .tile{padding:20px 10px}.tile svg{width:92px}.tile .n{font-size:16px}.tile .m{font-size:14px}
  .gente span{font-size:14px;padding:7px 14px}
  footer{padding:50px 16px calc(30px + env(safe-area-inset-bottom))}
}
@media (max-width:360px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}.arte svg,.aro{animation:none}}

/* ===== Toques de movimiento (se desactivan si el dispositivo pide menos animación) ===== */
@keyframes brillo{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.brilla{background:linear-gradient(100deg,var(--ink) 0%,#d62a62 25%,#2a6bd6 50%,#1f9d6b 75%,var(--ink) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:brillo 9s linear infinite}
@keyframes subir{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.acc-item.open .figs figure{animation:subir .75s cubic-bezier(.2,.7,.2,1) both}
.acc-item.open .figs figure:nth-child(2){animation-delay:.14s}
.acc-item.open .acc-in>p,.acc-item.open .acc-in>ul{animation:subir .6s ease both}
.figs figure{transition:transform .35s ease,box-shadow .35s ease}
.figs figure:hover{transform:translateY(-5px);box-shadow:0 18px 44px -20px var(--c)}
.tile svg{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.tile:hover svg{transform:scale(1.1) rotate(-4deg)}
nav button{transition:color .2s,background .25s,transform .2s}
nav button:hover{transform:translateY(-1px)}
.acc-head{transition:padding-left .25s ease,color .25s ease}
.acc-item:not(.open) .acc-head:hover{padding-left:34px}
#arriba{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 8px 24px -10px rgba(20,40,70,.35);opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .3s,transform .3s;z-index:40}
#arriba.on{opacity:1;transform:none;pointer-events:auto}
#arriba.on:hover{transform:translateY(-3px)}
@media (hover:none){.figs figure:hover{transform:none;box-shadow:none}.tile:hover svg{transform:none}.acc-item:not(.open) .acc-head:hover{padding-left:26px}}
@media (prefers-reduced-motion:reduce){.brilla{animation:none;background:none;-webkit-text-fill-color:currentColor;color:inherit}.acc-item.open .figs figure,.acc-item.open .acc-in>p,.acc-item.open .acc-in>ul{animation:none}.figs figure,.tile svg,nav button,.acc-head,#arriba{transition:none}}

figcaption{overflow-wrap:anywhere}
/* ===== Acabado profesional (mismos colores, fondo blanco) ===== */
body{text-rendering:optimizeLegibility}
h1,h2,.lema{text-wrap:balance}
.nw{white-space:nowrap}
nav{border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
nav.sombra{border-bottom-color:var(--line);box-shadow:0 8px 26px -18px rgba(20,40,70,.4)}
.encab{max-width:980px;margin:72px auto 0;padding:0 20px;text-align:center}
.encab h2{font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:-.025em;margin:0}
.encab p{margin:8px 0 0;color:var(--mute);font-size:17px}
.encab+.tiles{margin-top:26px}
.tile{position:relative;overflow:hidden;isolation:isolate}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--sx,50%) var(--sy,40%),color-mix(in srgb,var(--c) 14%,transparent),transparent 70%)}
.tile:hover::before{opacity:1}
.tile:hover{background:var(--card)}
.acc-head:hover{background:color-mix(in srgb,var(--c) 5%,transparent)}
.acc-item.open .acc-head{background:color-mix(in srgb,var(--c) 7%,transparent);border-bottom-left-radius:0;border-bottom-right-radius:0}
.acc-in{padding-top:18px}
.acc-in p{line-height:1.75}
.acc-in>p{max-width:78ch}
.figs figure{position:relative}

const CARDS = [];
const fmt = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
const parrafos = t => String(t).split("\n\n").map(q=>`<p>${fmt(q)}</p>`).join("");
const lista = l => `<ul>${l.map(i=>`<li>${fmt(i)}</li>`).join("")}</ul>`;
function contenido(x){
  let h="";
  if(x.p) h+=parrafos(x.p); else if(!x.l && !x.extra && !x.img && !x.video) h+=`<p>${pend("")}</p>`;
  if(x.l) h+=lista(x.l);
  (x.extra||[]).forEach(e=>{ h+=`<h4>${esc(e.h)}</h4>`+(e.p?parrafos(e.p):"")+(e.l?lista(e.l):""); });

  return h;
}
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function particulas(hero, color){
  if(RM) return;
  const c=document.createElement("canvas"); hero.prepend(c);
  const x=c.getContext("2d"); let w=0,h=0;
  const fit=()=>{w=c.width=hero.clientWidth;h=c.height=hero.clientHeight;}; fit();
  if(window.ResizeObserver) new ResizeObserver(fit).observe(hero);
  const col=()=>Array.isArray(color)?color[Math.floor(Math.random()*color.length)]:color;
  const ps=Array.from({length:innerWidth<640?22:40},()=>({x:Math.random()*w,y:Math.random()*h,r:2+Math.random()*7,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,a:.12+Math.random()*.3,c:col()}));
  (function paso(){
    if(!c.isConnected) return;
    x.clearRect(0,0,w,h);
    for(const p of ps){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-12)p.x=w+12; if(p.x>w+12)p.x=-12; if(p.y<-12)p.y=h+12; if(p.y>h+12)p.y=-12;
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283);
      x.globalAlpha=p.a; x.fillStyle=p.c; x.fill();
      x.globalAlpha=Math.min(1,p.a*2); x.strokeStyle=p.c; x.lineWidth=1.2; x.stroke();
    }
    requestAnimationFrame(paso);
  })();
}

let obs;
function mostrar(){
  const id = location.hash.slice(1) || "inicio";
  const tab = TABS.find(t=>t.id===id) || TABS[0];
  const m = MICROS.find(x=>x.id===tab.id);
  const v = $("vista");
  v.style.setProperty("--c", m ? `var(${m.color})` : "#1d2b3a");
  v.innerHTML = m ? vistaMicro(m) : tab.id==="cierre" ? vistaCierre() : vistaInicio();
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.id===tab.id));
  const sel=document.querySelector('nav button[aria-selected="true"]'); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"});
  document.title = (m ? m.nombre : tab.txt) + " | Microbiología";
  window.scrollTo(0,0);
  v.classList.remove("ent"); void v.offsetWidth; v.classList.add("ent");
  const pc = m ? getComputedStyle(v).getPropertyValue("--c").trim() : (tab.id==="inicio" ? ["#e0407a","#f0a030","#2fbf6a","#8a7bf0"] : "#1d2b3a");
  v.querySelectorAll(".hero").forEach(hr=>particulas(hr, pc));
  if(obs) obs.disconnect();
  obs = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("on"); obs.unobserve(e.target);} }),{threshold:.12});
  v.querySelectorAll(".rv").forEach((el,i)=>{ el.style.transitionDelay = (el.closest(".hero")? i*0.12 : 0)+"s"; obs.observe(el); });
}

let SAMPLE = null, CHAT = null, CTRL = null;
const HIST = {};
function iniciarIA(){
  if(!window.claude || !window.claude.use) return;
  window.claude.use("sample").then(s=>{ if(s){ SAMPLE=s; document.body.classList.add("ia"); } }).catch(()=>{});

function md(t){
  const inl = x => x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+?)\*/g,"$1<i>$2</i>");
  let h="", ul=false;
  for(const raw of esc(t).split("\n")){
    const li = raw.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    const hd = raw.match(/^#{1,4}\s+(.*)/);
    if(li){ if(!ul){h+="<ul>";ul=true;} h+=`<li>${inl(li[1])}</li>`; }
    else{ if(ul){h+="</ul>";ul=false;} if(hd) h+=`<p><b>${inl(hd[1])}</b></p>`; else if(raw.trim()) h+=`<p>${inl(raw)}</p>`; }
  }
  return h+(ul?"</ul>":"");
}
function textoBloque(x){
  let t = x.p ? x.p : (x.l||[]).map(i=>"- "+i).join("\n");
  (x.extra||[]).forEach(e=>{ t+="\n"+e.h+": "+(e.p||"")+"\n"+(e.l||[]).map(i=>"- "+i).join("\n"); });
  if(x.img&&x.img.length) t+="\nInfografías de este recuadro: "+x.img.map(g=>g.alt).join(" | ");
  return t.replace(/\*\*/g,"");
}
function instrucciones(c){

  const resumen=m.resumen.map(r=>r[0]+": "+r[1]).join("; ");
  const otros=m.bloques.filter(b=>b!==c.x).map(b=>b.t+": "+textoBloque(b)).join("\n");
  return `Eres el asistente de un trabajo universitario de Microbiología hecho por estudiantes de Enfermería. Quien te escribe es un visitante de la página (compañero, profesor u otra persona) que quiere entender mejor un tema.

Contexto de la página
- Microorganismo: ${m.nombre} (${m.grupo})
- Datos rápidos: ${resumen}
- Recuadro sobre el que preguntan: "${c.x.t}"
${textoBloque(c.x)}
- Otros apartados de la página:
${otros}

Cómo debes responder
- Responde siempre en español, con lenguaje claro y amable, como un buen profesor de microbiología y enfermería.
- Responde de verdad lo que preguntan: primero la respuesta directa, luego la explicación. Puedes ir más allá del recuadro y usar tu conocimiento sobre ${m.nombre} y sobre microbiología en general.
- Sé preciso y no inventes datos, cifras ni nombres. Si no estás seguro de algo, dilo. Si la información de la página y la realidad difieren, corrige con cuidado.
- Usa ejemplos o comparaciones sencillas cuando ayuden, y menciona la relación con el cuidado de enfermería (prevención, control de infecciones, educación al paciente) cuando venga al caso.
- Longitud media: entre 3 y 8 frases, o una lista corta. Usa **negrita** solo para términos clave. Si piden más detalle, amplía.
- Si la pregunta no tiene que ver con microbiología, salud o este trabajo, di amablemente que solo puedes ayudar con este tema y propón una pregunta relacionada.
- No des diagnósticos ni dosis de medicamentos para una persona en particular; recomienda consultar a un profesional de salud.`;
}

    : `<p class="hola">Pregunta lo que quieras sobre “${esc(CHAT.c.x.t)}”. Te respondo con gusto.</p>`;
  document.getElementById("sugs").innerHTML = h.length ? "" :
    ["Explícamelo más fácil","Dame un ejemplo","¿Qué tiene que ver con enfermería?"].map(t=>`<button type="button" data-sug="${esc(t)}">${esc(t)}</button>`).join("");
  box.scrollTop = box.scrollHeight;
}
function abrirChat(c){
  CHAT = {c, key:c.m.id+"|"+c.x.t};
  const el=document.getElementById("chat");
  el.style.setProperty("--c",`var(${c.m.color})`);
  document.getElementById("chat-micro").textContent = c.m.nombre;
  document.getElementById("chat-tema").textContent = c.x.t;
  pintarMsgs();
  el.classList.add("abierto"); el.setAttribute("aria-hidden","false");
  document.getElementById("velo").classList.add("on");
  setTimeout(()=>document.getElementById("q").focus(),350);
}
function cerrarChat(){
  if(CTRL){ CTRL.abort(); CTRL=null; }
  const el=document.getElementById("chat");
  el.classList.remove("abierto"); el.setAttribute("aria-hidden","true");
  document.getElementById("velo").classList.remove("on");
}
async function preguntar(q){
  q=q.trim(); if(!q||!SAMPLE||!CHAT||CTRL) return;
  const key=CHAT.key; (HIST[key]=HIST[key]||[]).push({role:"user",content:q});
  pintarMsgs();
  const box=document.getElementById("msgs");
  box.insertAdjacentHTML("beforeend",'<div class="burbuja ia pensando" id="vivo">Pensando…</div>');
  box.scrollTop=box.scrollHeight;
  const vivo=document.getElementById("vivo"), btn=document.getElementById("enviar");
  btn.disabled=true; CTRL=new AbortController();
  const msgs=HIST[key].map((x,i)=>({role:x.role, content: i===0 ? instrucciones(CHAT.c)+"\n\nPregunta del visitante:\n"+x.content : x.content}));
  try{
    const r=await SAMPLE(msgs,{cache:false,signal:CTRL.signal,modelTier:"default",
      onText:({text})=>{ vivo.classList.remove("pensando"); vivo.innerHTML=md(text); box.scrollTop=box.scrollHeight; }});
    HIST[key].push({role:"assistant",content:r.text});
  }catch(e){
    if(e && e.name==="AbortError"){ HIST[key].pop(); }
    else{
      const msg = e&&e.code==="not_granted" ? "Para usar el asistente tienes que permitir el acceso cuando la página te lo pida."
        : e&&e.code==="rate_limited" ? "Hiciste muchas preguntas seguidas. Espera un momento e inténtalo de nuevo."
        : "No pude responder en este momento. Inténtalo otra vez.";
      HIST[key].pop(); if(vivo.isConnected) vivo.outerHTML=`<div class="burbuja ia">${esc(msg)}</div>`;
      CTRL=null; btn.disabled=false; return;
    }
  }
  CTRL=null; btn.disabled=false;
  if(CHAT && CHAT.key===key) pintarMsgs();
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-ask]"); if(a){ abrirChat(CARDS[+a.dataset.ask]); return; }
  if(e.target.closest("[data-cerrar]")){ cerrarChat(); return; }
  const g=e.target.closest("[data-sug]"); if(g) preguntar(g.dataset.sug);
});
document.addEventListener("click",e=>{
  const h=e.target.closest(".acc-head"); if(!h) return;
  const it=h.parentElement, abrir=!it.classList.contains("open");
  document.querySelectorAll(".acc-item.open").forEach(o=>{o.classList.remove("open");o.querySelector(".acc-head").setAttribute("aria-expanded","false");});
  if(abrir){
    it.classList.add("open"); h.setAttribute("aria-expanded","true");
    setTimeout(()=>it.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"}),RM?0:420);
  }
});
function cerrarLuz(){ const l=document.getElementById("luz"); l.classList.remove("on","grande"); document.body.style.overflow=""; }
document.addEventListener("click",e=>{
  const z=e.target.closest("[data-zoom]");
  if(z){ const l=document.getElementById("luz"); const im=document.getElementById("luz-img"); im.src=z.src; im.alt=z.alt; l.scrollTo(0,0); l.classList.add("on"); document.body.style.overflow="hidden"; return; }
  if(e.target.id==="luz-img"){ const l=document.getElementById("luz"); l.classList.toggle("grande"); return; }
  if(e.target.id==="luz-x" || e.target.id==="luz") cerrarLuz();
});
addEventListener("keydown",e=>{ if(e.key==="Escape") cerrarLuz(); });
function tapadas(){
  if(RM) return;
  const its=[...document.querySelectorAll(".acc-item")];
  its.forEach((it,i)=>{
    const nx=its[i+1];
    it.classList.toggle("tapada", !!nx && nx.getBoundingClientRect().top - it.getBoundingClientRect().top < 40);
  });
}
let _t=false;
addEventListener("scroll",()=>{ if(_t) return; _t=true; requestAnimationFrame(()=>{ _t=false; tapadas(); }); },{passive:true});
addEventListener("resize",tapadas);
document.addEventListener("click",e=>{ if(e.target.closest(".acc-head")) setTimeout(tapadas,450); });
document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault(); const q=document.getElementById("q"); const t=q.value; q.value=""; q.style.height="auto"; preguntar(t);
});
document.getElementById("q").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
document.getElementById("q").addEventListener("input",e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"; });
addEventListener("keydown",e=>{ if(e.key==="Escape") cerrarChat(); });
addEventListener("hashchange",cerrarChat);
</script>

<button id="arriba" type="button" aria-label="Volver arriba">↑</button>
<script>
(function(){
  const b=document.getElementById("arriba"); if(!b) return;
  const act=()=>b.classList.toggle("on", window.scrollY>700);
  addEventListener("scroll",act,{passive:true}); act();
  b.addEventListener("click",()=>scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}));
})();
(function(){
  const nav=document.querySelector("nav");
  const act=()=>{ if(nav) nav.classList.toggle("sombra", window.scrollY>8); };
  addEventListener("scroll",act,{passive:true}); act();
  if(matchMedia("(hover:hover) and (pointer:fine)").matches){
    document.addEventListener("pointermove",e=>{
      const t=e.target.closest && e.target.closest(".tile"); if(!t) return;
      const r=t.getBoundingClientRect();
      t.style.setProperty("--sx",(e.clientX-r.left)+"px");
      t.style.setProperty("--sy",(e.clientY-r.top)+"px");
    },{passive:true});
  }
})();
</script>
